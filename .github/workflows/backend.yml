name: Backend CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'develop'
        type: choice
        options:
        - develop
        - staging
        - production
      debug_enabled:
        description: 'Run with debug logging'
        required: false
        type: boolean
        default: false
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements-dev.txt
    - name: Install tox
      run: pip install tox
    - name: Run tox
      run: tox

  deploy:
    needs: test
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'develop' }}
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - uses: actions/checkout@v4
    
    # Setup GCP authentication
    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Build and Push Container
      run: |
        if [ "${{ inputs.debug_enabled }}" = "true" ]; then
          echo "Debug mode enabled"
          set -x
        fi
        gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/metro-api

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy metro-api \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/metro-api \
          --platform managed \
          --region ${{ secrets.GCP_REGION }} \
          --allow-unauthenticated \
          --set-env-vars "METRO_API_URL=${{ secrets.METRO_API_URL }},METRO_KEY=${{ secrets.METRO_KEY }}" \
          --concurrency 5 \
          --max-instances 1 