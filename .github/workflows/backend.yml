name: Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements-dev.txt

    - name: Install tox
      run: pip install tox

    - name: Run tox
      run: tox
      env:
        METRO_API_URL: ${{ secrets.METRO_API_URL }}

    # Setup GCP authentication
    - id: 'auth'
      if: github.ref == 'refs/heads/main'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: 'Set up Cloud SDK'
      if: github.ref == 'refs/heads/main'
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Build and Push Container
      if: github.ref == 'refs/heads/main'
      run: |
        gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/metro-api

    - name: Deploy to Cloud Run
      if: github.ref == 'refs/heads/main'
      run: |
        gcloud run deploy metro-api \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/metro-api \
          --platform managed \
          --region ${{ secrets.GCP_REGION }} \
          --allow-unauthenticated \
          --set-env-vars "METRO_API_URL=${{ secrets.METRO_API_URL }}" 