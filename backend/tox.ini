[tox]
envlist = py311, lint, type
isolated_build = True
skipsdist = True

[testenv]
deps = -r requirements-dev.txt
commands =
    pytest {posargs:tests} --cov=app --cov-report=term-missing

[testenv:lint]
deps = 
    -r requirements-dev.txt
commands =
    black --check .
    flake8 .
    isort --check-only .
    pylint app/ tests/

[testenv:format]
deps = 
    black
    isort
commands =
    black .
    isort .

[testenv:type]
deps =
    -r requirements-dev.txt
commands =
    mypy app/

[flake8]
max-line-length = 88
extend-ignore = E203
exclude =
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    venv

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 88

[mypy]
python_version = 3.11
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
strict_optional = True

[coverage:run]
source = app/
omit = tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError 