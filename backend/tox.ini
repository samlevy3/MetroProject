[tox]
envlist = py311, lint, type
isolated_build = True
skipsdist = True

[testenv]
deps = -r requirements-dev.txt
commands =
    pytest {posargs:tests} --cov=app --cov-report=term-missing

[testenv:lint]
deps = 
    -r requirements-dev.txt
commands =
    black --check .
    isort --check-only .
    pylint src/ tests/

[testenv:format]
deps = 
    black
    isort
commands =
    black .
    isort .


[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 88

[coverage:run]
source = src/
omit = tests/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError 